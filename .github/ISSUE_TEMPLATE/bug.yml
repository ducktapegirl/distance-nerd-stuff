name: Bug report
description: Something on one of the dashboards is broken, wrong, or looks off.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The fields below aren't bureaucracy — most bugs on the web
        dashboards turn out to be **specific to one theme or one screen width**, so the
        theme/viewport answers are usually what makes a report reproducible.

        Filing about an **e-paper card**? Theme and screen size don't apply — pick the
        "not applicable" options and name the card instead. The panels are fixed-size and
        have no light/dark mode.

  - type: dropdown
    id: dashboard
    attributes:
      label: Which page or panel?
      options:
        - Strava dashboard (strava.html)
        - Running Log (college.html)
        - Landing page (index.html)
        - e-paper, Sticky panel - 800x480 grayscale (epaper.html)
        - e-paper, XIAO panel - 2.9-inch four-color (epaper_xiao.html)
        - More than one of the above
        - Not sure
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Which tab, section, or card?
      description: >
        Strava tabs: overview, volume, trends, segments, map, exploratory, art.
        Running Log tabs: overview, volume, mix, performance, races, patterns, art.
        For e-paper, name the card — its title, or its id from the proof sheet or its
        own URL (e.g. epaper/monthly-volume.html). Name the chart if you can.
      placeholder: e.g. performance → pace-over-time chart, or e-paper card "Monthly Volume"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: The legend is missing and the line runs off the right edge of the card.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Dark
        - Light
        - System
        - Happens in both light and dark
        - Not applicable - e-paper card
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: viewport
    attributes:
      label: Screen size
      description: Mobile-only bugs are the most common kind here, so this matters.
      options:
        - Phone (narrow, roughly 375px wide)
        - Tablet
        - Desktop
        - Happens on both phone and desktop
        - Not applicable - e-paper panel (fixed size)
        - Not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: >
        For an e-paper bug, say where you saw it instead — on the physical panel, or in
        a browser on the proof sheet. A card can look fine in a browser and still be
        unreadable on the panel.
      placeholder: e.g. Safari on iPhone 14, or Chrome on macOS, or "on the Sticky panel"
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image in. Enormously helpful for anything visual.
    validations:
      required: false
