name: Deploy dashboards

# Builds the dashboards from source (data + Python) and publishes to GitHub
# Pages. Triggers on any push to main that changes the data, the build
# scripts, the running-log source, or the Python environment. Also triggers
# when Strava Data Fetch completes: that workflow pushes data commits using
# the default GITHUB_TOKEN, and pushes made with that token don't fire other
# workflows' `push` triggers (GitHub's loop-prevention rule) — so the path
# filter above alone never catches the scheduled fetch. workflow_run isn't
# subject to that restriction.
on:
  push:
    branches: [main]
    paths:
      - "strava-data/data/**"
      - "strava-data/build_dashboard.py"
      - "strava-data/dashboard/**"
      - "strava-data/build_feed.py"
      - "strava-data/feed/**"
      - "running-log/dashboard/**"
      - "running-log/parse_log.py"
      - "running-log/visualize_log.py"
      - "running-log/qa.py"
      - "running-log/running_log.csv"
      - "running-log/running_log_story.html"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Strava Data Fetch"]
    types: [completed]
  # Daily rebuild, an hour after the fetch window. NOT redundant with the
  # triggers above: the e-paper feed's card_of_the_day is chosen at *build*
  # time (the panel runs no JavaScript), so epaper.html holds one fixed card
  # until the site is rebuilt. Without this the rotation would only advance
  # when the data changed. It re-renders committed data and makes no Strava
  # API calls.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev  # build needs only runtime deps; skip Playwright (dev)

      - name: Build Strava dashboard
        run: uv run python strava-data/build_dashboard.py
        env:
          # MapTiler key for the Places hero's Street/Terrain basemap tiles. Set
          # as a repo secret; must be domain-restricted to ducktapegirl.github.io
          # since it ships in the public HTML. Absent -> the hero runs Glow-only.
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}

      - name: Build Running Log dashboard
        run: uv run python running-log/visualize_log.py

      # E-paper feed for the reTerminal Sticky via SenseCraft HMI. Writes
      # feed.xml / epaper.html / epaper-all.html / feed.json into running-log/,
      # which is the Pages publish root uploaded below. Stdlib-only, no network.
      - name: Build e-paper feed
        run: uv run python strava-data/build_feed.py

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: running-log

      - uses: actions/deploy-pages@v4
        id: deployment
