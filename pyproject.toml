[project]
name = "distance-nerd-stuff"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "plotly==5.24.1",  # pinned to match the runtime CDN plotly.js 2.35.2 (see dashboard config.py)
    "numpy",
    "requests",
    "python-dotenv",
    "tqdm",
    "beautifulsoup4",
    "lxml",  # parser backend for parse_log.py's BeautifulSoup(html, "lxml")
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "playwright>=1.60.0",
]

# nerd_common/ is a small installed package holding helpers shared by both
# dashboards (design tokens, Plotly theme, formatters). Installing it via uv
# sync makes `import nerd_common` resolve from either dashboard's build script,
# which run with different sys.path roots.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nerd_common"]
