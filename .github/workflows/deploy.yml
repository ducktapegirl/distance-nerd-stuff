name: Deploy dashboards

# Builds the dashboards from source (data + Python) and publishes to GitHub
# Pages. Triggers on any push to main that changes the data, the build
# scripts, the running-log source, or the Python environment. Also triggers
# when Strava Data Fetch completes: that workflow pushes data commits using
# the default GITHUB_TOKEN, and pushes made with that token don't fire other
# workflows' `push` triggers (GitHub's loop-prevention rule) — so the path
# filter above alone never catches the scheduled fetch. workflow_run isn't
# subject to that restriction.
on:
  push:
    branches: [main]
    paths:
      - "strava-data/data/**"
      - "strava-data/build_dashboard.py"
      - "strava-data/dashboard/**"
      - "strava-data/build_feed.py"
      - "strava-data/feed/**"
      # A re-routed journey_routes.json (or a regenerated basemap) changes the
      # rendered cards without touching any Python.
      - "strava-data/assets/**"
      - "running-log/dashboard/**"
      - "running-log/parse_log.py"
      - "running-log/visualize_log.py"
      - "running-log/qa.py"
      - "running-log/running_log.csv"
      - "running-log/running_log_story.html"
      - "landing/**"
      - "build_landing.py"
      - "nerd_common/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Strava Data Fetch"]
    types: [completed]
  # Hourly rebuild. NOT redundant with the triggers above, and the cadence is
  # the whole point: the e-paper feed's card_of_the_day is chosen at *build*
  # time (the panel runs no JavaScript, so it cannot choose), which means the
  # rotation advances only as often as the site is rebuilt. Turning up the
  # device's own poll interval does nothing — it would just re-fetch the same
  # file. At hourly the 16-card rotation cycles in 16 hours instead of 16 days.
  #
  # It re-renders already-committed data and makes no Strava API calls, so the
  # cost is a runner minute; the concurrency group below cancels any overlap.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev  # build needs only runtime deps; skip Playwright (dev)

      - name: Build Strava dashboard
        run: uv run python strava-data/build_dashboard.py
        env:
          # MapTiler key for the Places hero's Street/Terrain basemap tiles. Set
          # as a repo secret; must be domain-restricted to ducktapegirl.github.io
          # since it ships in the public HTML. Absent -> the hero runs Glow-only.
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}

      - name: Build Running Log dashboard
        run: uv run python running-log/visualize_log.py

      # The site's front door at running-log/index.html. Reads both dashboards'
      # CSVs for its tile stats, so it comes after them by convention rather
      # than necessity — it imports neither build package.
      - name: Build landing page
        run: uv run python build_landing.py

      # E-paper feed for both panels via SenseCraft HMI. Writes feed.xml /
      # epaper.html / feed.json and the XIAO's epaper_xiao.{html,png,bin} /
      # feed_xiao.xml into running-log/, which is the Pages publish root
      # uploaded below. --no-sheets keeps the two proof sheets (epaper-all.html,
      # epaper_xiao-all.html) off the site: they are review surfaces for a
      # person at a desk, built locally, never published. No network.
      - name: Build e-paper feed
        run: uv run python strava-data/build_feed.py --no-sheets

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: running-log

      - uses: actions/deploy-pages@v4
        id: deployment
